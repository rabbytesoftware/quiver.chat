name: Release - Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  test-backend:
    name: Test Backend Before Release
    runs-on: ubuntu-latest
    needs: test-frontend
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.2'
    
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend/out/
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Build application
      run: go build -v ./...
    
    - name: Run tests
      run: go test -v -race ./...

  test-frontend:
    name: Test Frontend Before Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    
    - name: Lint frontend
      working-directory: frontend
      run: npm run lint
    
    - name: Build frontend
      working-directory: frontend
      run: npm run build
    
    - name: Upload frontend build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/out/
        retention-days: 1
    
    # Placeholder for future tests
    # - name: Run frontend tests
    #   working-directory: frontend
    #   run: npm test

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.2'
    
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend/out/
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Compute release tag
      id: version
      run: |
        # A plain vMAJOR.MINOR.PATCH tag lands in Quiver's stable channel;
        # a -suffix would make each release its own channel.
        VERSION=$(grep 'VERSION :=' Makefile | cut -d' ' -f3)
        if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+$'; then
          echo "Makefile VERSION must be MAJOR.MINOR, got '$VERSION'" >&2
          exit 1
        fi
        TAG="v${VERSION}.$(git rev-list --count HEAD)"
        echo "version=$TAG" >> $GITHUB_OUTPUT
        echo "Version: $TAG"

    - name: Build cross-platform binaries and create archives
      run: make release-archives
    
    - name: Generate release notes
      id: release_notes
      run: |
        echo "🚀 **Quiver Chat Release ${{ steps.version.outputs.version }}**" > release_notes.md
        echo "" >> release_notes.md
        echo "This release contains the latest version of Quiver Chat with the following binaries:" >> release_notes.md
        echo "" >> release_notes.md
        echo "## 📦 Available Downloads" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Linux" >> release_notes.md
        echo "- \`quiver-chat-linux-amd64.tar.gz\` - Linux x64" >> release_notes.md
        echo "- \`quiver-chat-linux-arm64.tar.gz\` - Linux ARM64" >> release_notes.md
        echo "" >> release_notes.md
        echo "### macOS" >> release_notes.md
        echo "- \`quiver-chat-macos-amd64.tar.gz\` - macOS Intel" >> release_notes.md
        echo "- \`quiver-chat-macos-arm64.tar.gz\` - macOS Apple Silicon" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Windows" >> release_notes.md
        echo "- \`quiver-chat-windows-amd64.zip\` - Windows x64" >> release_notes.md
        echo "- \`quiver-chat-windows-arm64.zip\` - Windows ARM64" >> release_notes.md
        echo "" >> release_notes.md
        echo "## 🚀 Quick Start" >> release_notes.md
        echo "" >> release_notes.md
        echo "1. Download the appropriate binary for your platform" >> release_notes.md
        echo "2. Extract the archive" >> release_notes.md
        echo "3. Run the binary: \`./quiver-chat-[platform]\`" >> release_notes.md
        echo "4. Open your browser and navigate to http://localhost:8080" >> release_notes.md
        echo "5. Choose a nickname and start chatting!" >> release_notes.md
        echo "" >> release_notes.md
        echo "## 📝 Recent Changes" >> release_notes.md
        echo "" >> release_notes.md
        # Get recent commits
        git log --oneline -10 --no-merges >> release_notes.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: "Quiver Chat ${{ steps.version.outputs.version }}"
        body_path: release_notes.md
        files: |
          dist/*.tar.gz
          dist/*.zip
        draft: false
        prerelease: false
        make_latest: true
        target_commitish: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Move the nightly tag
      run: |
        git tag -f nightly
        git push -f origin nightly

    - name: Publish the rolling nightly release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        target_commitish: ${{ github.sha }}
        name: Nightly
        prerelease: true
        body: Rolling build of the latest main. Follow it with quiver.chat@nightly.
        files: |
          dist/*.tar.gz
          dist/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
